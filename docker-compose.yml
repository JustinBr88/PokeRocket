version: '3.9'
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pokebattle
    networks:
      - pokefighter

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/pokebattle
      PORT: 3001
    networks:
      - pokefighter
    restart: unless-stopped

networks:
  pokefighter:
    driver: bridge

volumes:
  mongo_data: